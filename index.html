<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Shorts Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Desktop Overlay -->
    <div id="desktop-overlay">
        <div class="message-box">
            <h1>Mobile Experience Recommended</h1>
            <p>Please open this link on your mobile phone for the best experience.</p>
        </div>
    </div>

    <!-- Video & Image Feed -->
    <div class="video-container" id="video-feed">
        <!-- 0. .png -->
        <div class="video-slide" data-id="0">
            <img src="0. .png" alt="Slide 0" class="reel-asset">
        </div>
        
        <!-- 1. Mehandi.mp4 -->
        <div class="video-slide" data-id="1">
            <video src="1. Mehandi.mp4" loop playsinline preload="auto" class="reel-video reel-asset"></video>
        </div>

        <!-- 2. sundarkand.mp4 -->
        <div class="video-slide" data-id="2">
            <video src="2. sundarkand.mp4" loop playsinline preload="auto" class="reel-video reel-asset"></video>
        </div>

        <!-- 3. Haldi.mp4 -->
        <div class="video-slide" data-id="3">
            <video src="3. Haldi.mp4" loop playsinline preload="auto" class="reel-video reel-asset"></video>
        </div>

        <!-- 4. Sangeet.mp4 -->
        <div class="video-slide" data-id="4">
            <video src="4. Sangeet.mp4" loop playsinline preload="auto" class="reel-video reel-asset"></video>
        </div>

        <!-- 5. barat.mp4 -->
        <div class="video-slide" data-id="5">
            <video src="5. barat.mp4" loop playsinline preload="auto" class="reel-video reel-asset"></video>
        </div>

        <!-- 6. marriage.png -->
        <div class="video-slide" data-id="6">
            <img src="6. marriage.png" alt="Slide 6" class="reel-asset">
        </div>

        <!-- 7. Thank You.png -->
        <div class="video-slide" data-id="7">
            <img src="7. Thank You.png" alt="Slide 7" class="reel-asset">
        </div>
    </div>

    <!-- Scroll Hint -->
    <div id="scroll-hint">
        <span>Scroll down</span>
        <div class="arrow-down"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
